<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" role="img" aria-label="The four parts of a bed and the disposal route each one takes">
  <defs>
    <style>
      .t { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      .lbl { font-size: 25px; font-weight: 700; fill: #0c1b2e; }
      .sub { font-size: 18px; fill: #6d675f; }
    </style>
  </defs>

  <rect width="1000" height="420" fill="#f6f1e8"/>

  <!-- ── Mattress ── -->
  <g>
    <rect x="36" y="44" width="214" height="332" rx="24" fill="#fbf8f2" stroke="#0c1b2e" stroke-opacity="0.1" stroke-width="2"/>
    <rect x="65" y="112" width="156" height="56" rx="16" fill="#f6f1e8" stroke="#0c1b2e" stroke-opacity="0.2" stroke-width="3"/>
    <rect x="65" y="148" width="156" height="6" fill="#f0a033"/>
    <g fill="#0c1b2e" opacity="0.2">
      <circle cx="105" cy="130" r="5"/><circle cx="143" cy="130" r="5"/><circle cx="181" cy="130" r="5"/>
    </g>
    <text class="t lbl" x="143" y="256" text-anchor="middle">Mattress</text>
    <text class="t sub" x="143" y="290" text-anchor="middle">Per-piece fee</text>
    <rect x="113" y="330" width="60" height="5" rx="2.5" fill="#f0a033"/>
  </g>

  <!-- ── Box spring ── -->
  <g>
    <rect x="274" y="44" width="214" height="332" rx="24" fill="#fbf8f2" stroke="#0c1b2e" stroke-opacity="0.1" stroke-width="2"/>
    <rect x="303" y="120" width="156" height="48" rx="5" fill="#ece4d6" stroke="#0c1b2e" stroke-width="3"/>
    <path d="M341 120 V168 M381 120 V168 M421 120 V168" stroke="#0c1b2e" stroke-opacity="0.3" stroke-width="3"/>
    <text class="t lbl" x="381" y="256" text-anchor="middle">Box spring</text>
    <text class="t sub" x="381" y="290" text-anchor="middle">Its own fee</text>
    <rect x="351" y="330" width="60" height="5" rx="2.5" fill="#f0a033"/>
  </g>

  <!-- ── Metal frame ── -->
  <g>
    <rect x="512" y="44" width="214" height="332" rx="24" fill="#fbf8f2" stroke="#0c1b2e" stroke-opacity="0.1" stroke-width="2"/>
    <rect x="545" y="124" width="148" height="30" fill="none" stroke="#0c1b2e" stroke-width="9"/>
    <rect x="552" y="154" width="9" height="14" fill="#0c1b2e"/>
    <rect x="677" y="154" width="9" height="14" fill="#0c1b2e"/>
    <rect x="612" y="124" width="14" height="30" fill="#f0a033"/>
    <text class="t lbl" x="619" y="256" text-anchor="middle">Metal frame</text>
    <text class="t sub" x="619" y="290" text-anchor="middle">Scrap metal</text>
    <rect x="589" y="330" width="60" height="5" rx="2.5" fill="#f0a033"/>
  </g>

  <!-- ── Headboard ── -->
  <g>
    <rect x="750" y="44" width="214" height="332" rx="24" fill="#fbf8f2" stroke="#0c1b2e" stroke-opacity="0.1" stroke-width="2"/>
    <path d="M807 168 V128 a50 28 0 0 1 100 0 V168 Z" fill="#0c1b2e"/>
    <path d="M831 168 V136 M857 168 V132 M883 168 V136" stroke="#f6f1e8" stroke-opacity="0.22" stroke-width="4"/>
    <text class="t lbl" x="857" y="256" text-anchor="middle">Headboard</text>
    <text class="t sub" x="857" y="290" text-anchor="middle">Wood waste</text>
    <rect x="827" y="330" width="60" height="5" rx="2.5" fill="#f0a033"/>
  </g>
</svg>
