<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="A mattress in front of the North Shore ridge line, beside a gold recycling symbol">
  <defs>
    <!-- One arrow of the recycling triangle; rotated twice to complete it. -->
    <path id="np-recycle-arrow" d="M-1.9,-69.3 L17.2,-80.3 L59.8,-6.4 L40.8,4.6 Z M30.4,10.6 L70.2,-12.4 L73.2,38.7 Z"/>
  </defs>

  <rect width="1200" height="630" fill="#0c1b2e"/>

  <!-- Sun disc, low over the water -->
  <circle cx="898" cy="258" r="122" fill="#f0a033"/>

  <!-- Recycling mark, cut out of the sun in navy -->
  <g transform="translate(898 258) scale(0.86)" fill="#0c1b2e">
    <use href="#np-recycle-arrow"/>
    <use href="#np-recycle-arrow" transform="rotate(120)"/>
    <use href="#np-recycle-arrow" transform="rotate(240)"/>
  </g>

  <!-- Back ridge -->
  <path d="M0 392 L148 286 L268 356 L412 228 L534 344 L648 262 L772 366 L892 292 L1024 374 L1132 314 L1200 368 L1200 630 L0 630 Z" fill="#1f4266"/>
  <path d="M412 228 L456 270 L432 278 L412 267 L392 277 L368 270 Z" fill="#f6f1e8"/>
  <path d="M148 286 L184 320 L165 327 L148 318 L131 326 L112 320 Z" fill="#f6f1e8"/>

  <!-- Front ridge -->
  <path d="M0 452 L132 378 L268 448 L392 374 L530 456 L656 398 L798 464 L926 404 L1060 470 L1200 414 L1200 630 L0 630 Z" fill="#16324f"/>

  <!-- Ground -->
  <rect y="470" width="1200" height="160" fill="#0a1a2c"/>
  <rect y="470" width="1200" height="4" fill="#f0a033" opacity="0.55"/>

  <!-- Mattress resting on the ground line -->
  <g transform="translate(206 302) rotate(-5)">
    <rect x="0" y="0" width="372" height="184" rx="30" fill="#f6f1e8"/>
    <rect x="0" y="132" width="372" height="52" rx="26" fill="#ece4d6"/>
    <rect x="0" y="128" width="372" height="6" fill="#f0a033"/>
    <rect x="16" y="16" width="340" height="102" rx="18" fill="none" stroke="#0c1b2e" stroke-opacity="0.15" stroke-width="4"/>
    <g fill="#0c1b2e" opacity="0.18">
      <circle cx="88" cy="46" r="7"/><circle cx="186" cy="46" r="7"/><circle cx="284" cy="46" r="7"/>
      <circle cx="88" cy="94" r="7"/><circle cx="186" cy="94" r="7"/><circle cx="284" cy="94" r="7"/>
    </g>
  </g>
</svg>
