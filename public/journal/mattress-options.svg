<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" role="img" aria-label="The three disposal routes: depot drop-off, private recycler, and booked pickup">
  <defs>
    <path id="opt-arrow" d="M-1.9,-69.3 L17.2,-80.3 L59.8,-6.4 L40.8,4.6 Z M30.4,10.6 L70.2,-12.4 L73.2,38.7 Z"/>
    <style>
      .t { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      .lbl { font-size: 27px; font-weight: 700; fill: #0c1b2e; }
      .sub { font-size: 19px; fill: #6d675f; }
    </style>
  </defs>

  <rect width="1000" height="420" fill="#f6f1e8"/>

  <!-- ── Option 1: depot drop-off ── -->
  <g>
    <rect x="36" y="44" width="296" height="332" rx="24" fill="#fbf8f2" stroke="#0c1b2e" stroke-opacity="0.1" stroke-width="2"/>
    <circle cx="184" cy="136" r="62" fill="#0c1b2e" opacity="0.05"/>
    <!-- mattress strapped to the roof -->
    <rect x="132" y="92" width="104" height="18" rx="9" fill="#ece4d6" stroke="#0c1b2e" stroke-width="3"/>
    <rect x="160" y="92" width="7" height="18" fill="#f0a033"/>
    <rect x="202" y="92" width="7" height="18" fill="#f0a033"/>
    <!-- car -->
    <path d="M150 122 L162 100 L206 100 L218 122 Z" fill="#16324f"/>
    <rect x="126" y="120" width="116" height="30" rx="12" fill="#0c1b2e"/>
    <circle cx="152" cy="152" r="12" fill="#0c1b2e"/>
    <circle cx="216" cy="152" r="12" fill="#0c1b2e"/>
    <circle cx="152" cy="152" r="4.5" fill="#f6f1e8"/>
    <circle cx="216" cy="152" r="4.5" fill="#f6f1e8"/>
    <text class="t lbl" x="184" y="252" text-anchor="middle">Depot drop-off</text>
    <text class="t sub" x="184" y="288" text-anchor="middle">Transfer station</text>
    <text class="t sub" x="184" y="314" text-anchor="middle">or landfill</text>
    <rect x="154" y="342" width="60" height="5" rx="2.5" fill="#f0a033"/>
  </g>

  <!-- ── Option 2: private recycler ── -->
  <g>
    <rect x="352" y="44" width="296" height="332" rx="24" fill="#fbf8f2" stroke="#0c1b2e" stroke-opacity="0.1" stroke-width="2"/>
    <circle cx="500" cy="136" r="62" fill="#0c1b2e" opacity="0.05"/>
    <!-- recycling plant, with the mark as a sign on the wall -->
    <rect x="450" y="116" width="100" height="58" fill="#0c1b2e"/>
    <rect x="528" y="90" width="16" height="26" fill="#16324f"/>
    <rect x="450" y="174" width="100" height="6" fill="#16324f"/>
    <g transform="translate(492 145) scale(0.27)" fill="#f0a033">
      <use href="#opt-arrow"/>
      <use href="#opt-arrow" transform="rotate(120)"/>
      <use href="#opt-arrow" transform="rotate(240)"/>
    </g>
    <text class="t lbl" x="500" y="252" text-anchor="middle">Private recycler</text>
    <text class="t sub" x="500" y="288" text-anchor="middle">Nearly 100% of</text>
    <text class="t sub" x="500" y="314" text-anchor="middle">materials reused</text>
    <rect x="470" y="342" width="60" height="5" rx="2.5" fill="#f0a033"/>
  </g>

  <!-- ── Option 3: booked pickup ── -->
  <g>
    <rect x="668" y="44" width="296" height="332" rx="24" fill="#fbf8f2" stroke="#0c1b2e" stroke-opacity="0.1" stroke-width="2"/>
    <circle cx="816" cy="136" r="62" fill="#0c1b2e" opacity="0.05"/>
    <!-- box truck, cab leading -->
    <rect x="766" y="104" width="78" height="50" rx="5" fill="#0c1b2e"/>
    <rect x="766" y="120" width="78" height="8" fill="#f0a033"/>
    <rect x="732" y="118" width="36" height="36" rx="6" fill="#16324f"/>
    <rect x="738" y="124" width="22" height="14" rx="3" fill="#f6f1e8"/>
    <circle cx="750" cy="158" r="12" fill="#0c1b2e"/>
    <circle cx="820" cy="158" r="12" fill="#0c1b2e"/>
    <circle cx="750" cy="158" r="4.5" fill="#f6f1e8"/>
    <circle cx="820" cy="158" r="4.5" fill="#f6f1e8"/>
    <text class="t lbl" x="816" y="252" text-anchor="middle">Book a pickup</text>
    <text class="t sub" x="816" y="288" text-anchor="middle">Crew carries it out</text>
    <text class="t sub" x="816" y="314" text-anchor="middle">and recycles it</text>
    <rect x="786" y="342" width="60" height="5" rx="2.5" fill="#f0a033"/>
  </g>
</svg>
